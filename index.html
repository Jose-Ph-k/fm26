<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>FM26 Scout AI</title>
  <style>
    :root{
      --bg:#0b1020;--card:#151b2f;--muted:#94a3b8;--text:#f8fafc;
      --line:#29324a;--accent:#7dd3fc;--good:#86efac;--warn:#fde68a;--bad:#fca5a5;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:760px;margin:auto;padding:18px 14px 40px}
    h1{font-size:26px;margin:4px 0}.sub{color:var(--muted);margin:0 0 18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
    label{display:block;font-size:13px;color:var(--muted);margin:11px 0 6px}
    input,select,button,textarea{width:100%;font:inherit;border-radius:12px;border:1px solid var(--line);
      padding:12px;background:#0f172a;color:var(--text)}
    button{background:#1d4ed8;border:0;font-weight:700;min-height:46px}
    button.secondary{background:#24324d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:560px){.grid{grid-template-columns:1fr}}
    #preview{width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:#0f172a;display:none}
    .result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .metric{background:#0f172a;border-radius:14px;padding:12px;text-align:center}
    .metric small{display:block;color:var(--muted);margin-bottom:4px}.metric strong{font-size:19px}
    .pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#24324d;margin:4px 4px 0 0;font-size:13px}
    #analysisText{line-height:1.55}.notice{font-size:13px;color:var(--muted)}
    .good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
  </style>
</head>
<body>
<main>
  <h1>FM26 Scout AI</h1>
  <p class="sub">선수 캡처 → 정보 확인 → 영입/임대/매각 판단</p>

  <section class="card">
    <h2>1. 선수 캡처</h2>
    <input id="imageInput" type="file" accept="image/*" />
    <div style="height:10px"></div>
    <img id="preview" alt="선수 프로필 캡처 미리보기" />
    <p class="notice">현재 V1은 이미지 업로드/보관 UI가 동작합니다. 자동 이미지 판독은 서버형 AI 연결 지점이 준비되어 있습니다.</p>
  </section>

  <section class="card">
    <h2>2. 선수 정보</h2>
    <div class="grid">
      <div><label>이름</label><input id="name" placeholder="예: Max Müller"></div>
      <div><label>나이</label><input id="age" type="number" min="15" max="45" value="21"></div>
      <div><label>포지션</label>
        <select id="position"><option>ST</option><option>AMC</option><option>AML/AMR</option><option>CM</option><option>DM</option><option>FB/WB</option><option>CB</option><option>GK</option></select>
      </div>
      <div><label>현재 수준 추정</label><input id="ca" type="number" min="1" max="200" value="145"></div>
      <div><label>잠재력 추정</label><input id="pa" type="number" min="1" max="200" value="165"></div>
      <div><label>주급/가격 체감</label>
        <select id="cost"><option value="low">저렴</option><option value="fair" selected>적정</option><option value="high">비쌈</option></select>
      </div>
    </div>
    <label>특징 메모</label>
    <textarea id="notes" rows="3" placeholder="예: 빠름, 오프더볼 좋음, 공중볼 약함"></textarea>
    <div style="height:12px"></div>
    <button id="analyzeBtn">분석하기</button>
  </section>

  <section class="card" id="resultCard" style="display:none">
    <h2>3. 분석 결과</h2>
    <div class="result">
      <div class="metric"><small>판정</small><strong id="decision">-</strong></div>
      <div class="metric"><small>현재 수준</small><strong id="level">-</strong></div>
      <div class="metric"><small>성장 여지</small><strong id="growth">-</strong></div>
    </div>
    <p id="analysisText"></p>
    <div id="tags"></div>
  </section>

  <section class="card">
    <h2>AI 연결 구조</h2>
    <p class="notice">브라우저 안에 OpenAI API 키를 직접 넣으면 키가 노출될 수 있습니다. 따라서 실제 자동 판독은 <b>PWA → 보안 서버/서버리스 함수 → AI 이미지 분석</b> 구조로 연결하도록 설계했습니다.</p>
  </section>
</main>

<script>
const input = document.getElementById('imageInput');
const preview = document.getElementById('preview');
input.addEventListener('change', ()=>{
  const f=input.files?.[0]; if(!f){preview.style.display='none';return;}
  preview.src=URL.createObjectURL(f); preview.style.display='block';
});

function tier(ca){
  if(ca>=170) return '월드클래스';
  if(ca>=155) return '강팀 주전';
  if(ca>=140) return '1군 로테이션';
  if(ca>=125) return '백업/중위권';
  return '유망주/하부';
}

document.getElementById('analyzeBtn').addEventListener('click', ()=>{
  const name=document.getElementById('name').value.trim() || '이 선수';
  const age=Number(document.getElementById('age').value||0);
  const ca=Number(document.getElementById('ca').value||0);
  const pa=Number(document.getElementById('pa').value||0);
  const cost=document.getElementById('cost').value;
  const pos=document.getElementById('position').value;
  const notes=document.getElementById('notes').value.trim();

  const growth=Math.max(0,pa-ca);
  let decision='관찰';
  let cls='warn';
  if(age<=25 && pa>=165 && cost!=='high'){decision='영입 후보';cls='good';}
  else if(age<=23 && growth>=18){decision='영입 후 임대';cls='good';}
  else if(age>=29 && ca<155){decision='비추천/매각';cls='bad';}
  else if(ca>=155 && cost!=='high'){decision='즉전감';cls='good';}
  else if(cost==='high' && ca<155){decision='가격 협상';cls='warn';}

  const d=document.getElementById('decision');
  d.textContent=decision; d.className=cls;
  document.getElementById('level').textContent=tier(ca);
  document.getElementById('growth').textContent='+'+growth;
  document.getElementById('analysisText').textContent =
    `${name} (${age}세, ${pos})는 현재 CA ${ca}, PA ${pa} 기준으로 ${tier(ca)} 수준으로 평가됩니다. `+
    `성장 여지는 ${growth}이며, 현재 입력한 가격 조건을 반영한 1차 판정은 '${decision}'입니다.`+
    (notes ? ` 메모: ${notes}` : '');
  document.getElementById('tags').innerHTML =
    [`나이 ${age}`,`CA ${ca}`,`PA ${pa}`,`포지션 ${pos}`, cost==='low'?'가성비':'비용 '+(cost==='fair'?'적정':'높음')]
      .map(x=>`<span class="pill">${x}</span>`).join('');
  document.getElementById('resultCard').style.display='block';
  document.getElementById('resultCard').scrollIntoView({behavior:'smooth',block:'start'});
});

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
