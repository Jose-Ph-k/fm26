<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes">
<title>FM26 Scout AI</title><link rel="manifest" href="/manifest.webmanifest">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f7fb;background:#090e1d}
body{margin:0}.wrap{max-width:820px;margin:auto;padding:28px 18px 80px}.card{background:#141b31;border:1px solid #2c3655;border-radius:20px;padding:20px;margin:16px 0}
h1{margin:0 0 5px}h2{margin-top:0}.muted{color:#9da9c5}.drop{display:block;padding:18px;border:1px dashed #506083;border-radius:14px;text-align:center}
input{width:100%}img{width:100%;max-height:480px;object-fit:contain;border-radius:14px;margin-top:14px;background:#090e1d}
button{width:100%;padding:15px;border:0;border-radius:13px;background:#2859e8;color:white;font-size:17px;font-weight:700;margin-top:14px}
button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pill{background:#0e1528;padding:12px;border-radius:12px}
pre{white-space:pre-wrap;font:inherit;line-height:1.55}.good{color:#72e5a3}.warn{color:#ffd36b}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap">
<h1>FM26 Scout AI <small>V2</small></h1><div class="muted">선수 캡처 → AI 자동 판독 → 스카우팅 보고서</div>
<section class="card"><h2>1. 선수 캡처</h2>
<label class="drop">FM26 선수 프로필 캡처 선택<input id="file" type="file" accept="image/*"></label>
<img id="preview" hidden><button id="go" disabled>AI 분석하기</button><div id="status" class="muted"></div></section>
<section class="card" id="result" hidden><h2>2. AI 스카우팅 보고서</h2><div id="facts" class="grid"></div><h3>판단</h3><pre id="report"></pre></section>
</main>
<script>
const f=document.querySelector('#file'), p=document.querySelector('#preview'), go=document.querySelector('#go'),
status=document.querySelector('#status'), result=document.querySelector('#result'), facts=document.querySelector('#facts'), report=document.querySelector('#report');
let dataUrl="";
f.onchange=()=>{const file=f.files[0]; if(!file)return; const r=new FileReader();r.onload=()=>{dataUrl=r.result;p.src=dataUrl;p.hidden=false;go.disabled=false;result.hidden=true};r.readAsDataURL(file)};
go.onclick=async()=>{go.disabled=true;status.textContent="이미지를 읽고 있습니다…";try{
 const res=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image:dataUrl})});
 const d=await res.json();if(!res.ok)throw new Error(d.error||"분석 실패");
 const x=d.player||{};facts.innerHTML=[
 ["이름",x.name],["나이",x.age],["국적",x.nationality],["포지션",x.position],["클럽",x.club],
 ["주발",x.foot],["키",x.height],["성격",x.personality],["현재 기량",x.current_level],["잠재력",x.potential]
 ].map(([a,b])=>`<div class="pill"><span class="muted">${a}</span><br><b>${b??"판독 불가"}</b></div>`).join("");
 report.textContent=[`결론: ${d.decision||"-"}`,`추천 역할: ${d.best_role||"-"}`,`장점: ${(d.strengths||[]).join(", ")||"-"}`,
 `약점: ${(d.weaknesses||[]).join(", ")||"-"}`,`영입/육성 판단: ${d.recruitment||"-"}`,`가격 판단: ${d.price_view||"-"}`,
 `CA 추정: ${d.ca_estimate||"정확한 숫자 추정 안 함"}`,`확신도: ${d.confidence||"-"}`,`메모: ${d.notes||"-"}`].join("\n\n");
 result.hidden=false;status.textContent="분석 완료";
}catch(e){status.textContent="오류: "+e.message}finally{go.disabled=false}};
</script></body></html>
